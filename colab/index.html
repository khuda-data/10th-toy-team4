<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버스 실시간 모니터링 · 탑승 대기 예측 (queue-boarding/v1.0.0)</title>
<script
  type="text/javascript"
  src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f6db8c9a648d5df15b8f34334127e1b9">
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f4f6f9; }

  /* ── 헤더 ── */
  header { background: #1e293b; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; z-index: 30; }
  header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; }
  header .subtitle { font-size: 12px; color: #94a3b8; }

  /* 검색 */
  .search-box { position: relative; display: flex; gap: 6px; flex: 1; max-width: 420px; }
  .search-box input { flex: 1; padding: 8px 12px; border-radius: 8px; border: none; font-size: 14px; outline: none; }
  .search-box button { padding: 8px 14px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font-size: 14px; cursor: pointer; }
  .search-box button:hover { background: #2563eb; }
  .search-dropdown { position: absolute; top: 42px; left: 0; right: 0; background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 320px; overflow-y: auto; display: none; z-index: 50; }
  .search-dropdown.open { display: block; }
  .search-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; }
  .search-item:hover { background: #eff6ff; }
  .search-item .name { font-weight: 700; color: #1e293b; font-size: 14px; }
  .search-item .name .type { font-size: 11px; color: #3b82f6; margin-left: 6px; font-weight: 500; }
  .search-item .name .unsupported { font-size: 11px; color: #f59e0b; margin-left: 6px; }
  .search-item .path { font-size: 12px; color: #64748b; margin-top: 2px; }

  /* 대기 인원 입력 */
  .queue-input { display: flex; align-items: center; gap: 6px; background: #334155; border-radius: 8px; padding: 5px 10px; }
  .queue-input label { font-size: 12px; color: #cbd5e1; white-space: nowrap; }
  .queue-input input { width: 58px; padding: 4px 6px; border-radius: 6px; border: none; font-size: 14px; text-align: center; }

  /* LIVE + 타이머 */
  .live-area { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #f87171; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .updated-at { font-size: 11px; color: #94a3b8; }
  .timer-wrap { position: relative; width: 44px; height: 44px; }
  .timer-wrap svg { transform: rotate(-90deg); }
  .timer-ring-bg { fill: none; stroke: #475569; stroke-width: 4; }
  .timer-ring { fill: none; stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
  .timer-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: #fff; }

  /* ── 본문 ── */
  .main { flex: 1; display: flex; overflow: hidden; }
  #map { flex: 1; position: relative; }

  /* 로딩 오버레이 */
  #loading-overlay { position: absolute; inset: 0; background: rgba(255,255,255,.65); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 20; }
  #loading-overlay.show { display: flex; }
  .spinner { width: 42px; height: 42px; border: 5px solid #dbeafe; border-top-color: #3b82f6; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay p { font-size: 14px; color: #334155; font-weight: 600; }

  /* 좌측 정류장 목록 */
  .sidebar { width: 320px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar h2 { font-size: 14px; padding: 12px 16px; border-bottom: 1px solid #e2e8f0; color: #334155; }
  #station-list { flex: 1; overflow-y: auto; }
  .station-item { padding: 10px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #334155; }
  .station-item:hover { background: #f8fafc; }
  .station-item.active { background: #eff6ff; border-left: 4px solid #3b82f6; font-weight: 700; }
  .station-item .seq { color: #94a3b8; font-size: 11px; width: 26px; flex-shrink: 0; }
  .seat-chip { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .chip-green { background: #dcfce7; color: #15803d; }
  .chip-yellow { background: #fef9c3; color: #a16207; }
  .chip-red { background: #fee2e2; color: #b91c1c; }
  .placeholder { padding: 30px 16px; text-align: center; color: #94a3b8; font-size: 13px; }

  /* 토스트 */
  #toast-area { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: toast-in .25s ease; }
  .toast.error { background: #b91c1c; }
  .toast.success { background: #15803d; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

  /* 우측 정류장 상세 패널 */
  .detail-panel { width: 370px; background: #f8fafc; border-left: 1px solid #e2e8f0; display: none; flex-direction: column; flex-shrink: 0; box-shadow: -12px 0 32px rgba(15,23,42,.12); }
  .detail-panel.open { display: flex; }
  .detail-header { padding: 15px 18px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #fff; }
  .detail-header h2 { font-size: 15px; color: #1e293b; }
  .detail-close { width: 28px; height: 28px; border: 0; border-radius: 7px; background: #f1f5f9; color: #475569; cursor: pointer; font-size: 19px; line-height: 1; }
  .detail-close:hover { background: #e2e8f0; }
  #detail-content { overflow-y: auto; padding: 16px; }
  .pred-popup { font-family: inherit; font-size: 13px; padding: 0; }
  .pred-popup .title { font-weight: 800; font-size: 13px; margin-bottom: 6px; }
  .detail-kicker { color: #64748b; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
  .detail-queue { margin-top: 8px; color: #475569; font-size: 13px; }
  .pred-dispatch { border-radius: 14px; padding: 15px; font-weight: 800; font-size: 17px; margin: 10px 0 16px; line-height: 1.35; }
  .pred-dispatch small { display: block; margin-top: 5px; font-size: 11px; font-weight: 600; opacity: .75; }
  .pred-dispatch.d0 { background: linear-gradient(135deg, #dcfce7, #f0fdf4); color: #15803d; }.pred-dispatch.d1 { background: linear-gradient(135deg, #fef9c3, #fffbeb); color: #a16207; }.pred-dispatch.d2 { background: linear-gradient(135deg, #ffedd5, #fff7ed); color: #c2410c; }.pred-dispatch.d3 { background: linear-gradient(135deg, #fee2e2, #fff1f2); color: #b91c1c; }
  .section-label { color: #475569; font-size: 12px; font-weight: 800; margin: 14px 0 8px; }
  .pred-bus-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 13px; padding: 13px; margin-top: 9px; }.bus-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }.bus-card-name { color: #334155; font-weight: 800; }.bus-order { display: inline-flex; width: 23px; height: 23px; border-radius: 50%; align-items: center; justify-content: center; background: #e0e7ff; color: #4338ca; font-size: 11px; margin-right: 6px; }.bus-card-state { font-size: 11px; font-weight: 800; padding: 4px 7px; border-radius: 99px; }.bus-card-state.good { color: #15803d; background: #dcfce7; }.bus-card-state.mid { color: #a16207; background: #fef9c3; }.bus-card-state.low { color: #b91c1c; background: #fee2e2; }
  .seat-line { display: flex; align-items: baseline; gap: 6px; margin: 11px 0 8px; }.seat-line strong { color: #0f172a; font-size: 26px; letter-spacing: -.04em; }.seat-line span { color: #64748b; font-size: 12px; }.prob-line { display: flex; justify-content: space-between; color: #64748b; font-size: 11px; margin-bottom: 5px; }.prob-line b { color: #334155; }.prob-track { height: 7px; overflow: hidden; border-radius: 99px; background: #e2e8f0; }.prob-track > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2563eb, #60a5fa); }
  .dispatch-prob-card { margin-top: 14px; padding: 14px; border: 1px solid #dbeafe; border-radius: 14px; background: #eff6ff; }.dispatch-prob-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #1e3a8a; font-size: 12px; font-weight: 800; }.dispatch-prob-head span { color: #475569; font-size: 11px; font-weight: 600; }.dispatch-prob-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 11px; }.dispatch-prob-item { padding: 8px 3px; border: 1px solid #bfdbfe; border-radius: 9px; background: rgba(255,255,255,.72); text-align: center; color: #64748b; }.dispatch-prob-item.active { border-color: #2563eb; background: #2563eb; color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,.22); }.dispatch-prob-item strong { display: block; font-size: 15px; }.dispatch-prob-item small { display: block; margin-top: 2px; font-size: 10px; }.dispatch-expectation { margin-top: 10px; color: #334155; font-size: 12px; }.dispatch-expectation b { color: #1d4ed8; }
  .pred-prob { color: #64748b; font-size: 11px; margin-top: 12px; line-height: 1.55; }
  @media (max-width: 860px) {
    .sidebar { width: 250px; }
    .detail-panel { position: absolute; top: 0; right: 0; bottom: 0; z-index: 20; width: min(360px, 92vw); }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>🚌 버스 실시간 모니터링</h1>
    <div class="subtitle">정류장 클릭 시 잔여석 + 필요 배차(몇 대 보내야 하는지) 예측 · queue-boarding/v1.0.0</div>
  </div>

  <div class="search-box">
    <input id="route-search" type="text" placeholder="노선 검색 (예: M5107)" autocomplete="off">
    <button id="search-btn">🔍 검색</button>
    <div id="search-dropdown" class="search-dropdown"></div>
  </div>

  <div class="queue-input">
    <label for="queue-ahead">내 앞 대기 인원</label>
    <input id="queue-ahead" type="number" min="0" value="0">
  </div>

  <div class="live-area">
    <div>
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <div class="updated-at" id="updated-at">마지막 갱신 --:--:--</div>
    </div>
    <div class="timer-wrap">
      <svg width="44" height="44">
        <circle class="timer-ring-bg" cx="22" cy="22" r="18"></circle>
        <circle id="timer-ring" class="timer-ring" cx="22" cy="22" r="18"
                stroke="#3b82f6" stroke-dasharray="113.1" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-num" id="timer-num">10</div>
    </div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <h2 id="sidebar-title">정류장 목록</h2>
    <div id="station-list"><div class="placeholder">위에서 버스 노선을 검색하고 선택하세요</div></div>
  </div>
  <div id="map">
    <div id="loading-overlay"><div class="spinner"></div><p id="loading-text">노선 정보를 불러오는 중...</p></div>
  </div>
  <aside id="detail-panel" class="detail-panel">
    <div class="detail-header">
      <h2 id="detail-title">정류장 상세</h2>
      <button id="detail-close" class="detail-close" type="button" aria-label="상세 패널 닫기">×</button>
    </div>
    <div id="detail-content"><div class="placeholder">정류장을 선택하면 버스별 도착 예상 잔여석과 배차 권고를 확인할 수 있습니다.</div></div>
  </aside>
</div>

<div id="toast-area"></div>

<script>
// ─────────────────────────────────────────────
// 상태
// ─────────────────────────────────────────────
const POLL_SECONDS = 10;
const RING_LEN = 2 * Math.PI * 18; // 113.1

let map, currentRouteId = null, currentRouteName = "";
let stations = [], buses = [];
let stationMarkers = {}, busMarkers = {};
let activeSeq = null;
let pollTimer = null, countdownTimer = null, remainSec = POLL_SECONDS;

// ─────────────────────────────────────────────
// 지도 초기화
// ─────────────────────────────────────────────
map = new kakao.maps.Map(document.getElementById('map'), {
  center: new kakao.maps.LatLng(37.2749, 127.0096),
  level: 7
});
document.getElementById('detail-close').addEventListener('click', () => {
  document.getElementById('detail-panel').classList.remove('open');
});

function showDetail(station, html) {
  document.getElementById('detail-title').textContent = `📍 ${station.stationName}`;
  document.getElementById('detail-content').innerHTML = html;
  document.getElementById('detail-panel').classList.add('open');
}

// ─────────────────────────────────────────────
// 유틸: 토스트 / 로딩 / 혼잡도
// ─────────────────────────────────────────────
function toast(msg, type = "") {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function setLoading(on, text) {
  const ov = document.getElementById('loading-overlay');
  if (text) document.getElementById('loading-text').textContent = text;
  ov.classList.toggle('show', on);
}
// 🔴혼잡(≤8) / 🟡보통(≤20) / 🟢여유(>20)
function congestion(seats) {
  if (seats < 0)  return { emoji: '⚪', label: '정보없음', color: '#94a3b8', chip: 'chip-yellow' };
  if (seats <= 8)  return { emoji: '🔴', label: '혼잡',  color: '#ef4444', chip: 'chip-red' };
  if (seats <= 20) return { emoji: '🟡', label: '보통',  color: '#f59e0b', chip: 'chip-yellow' };
  return              { emoji: '🟢', label: '여유',  color: '#22c55e', chip: 'chip-green' };
}

// ─────────────────────────────────────────────
// 카운트다운 타이머 (SVG 원형)
// ─────────────────────────────────────────────
function startCountdown() {
  stopCountdown();
  remainSec = POLL_SECONDS;
  renderCountdown();
  countdownTimer = setInterval(() => {
    remainSec -= 1;
    if (remainSec < 0) remainSec = POLL_SECONDS; // 폴링과 동기화
    renderCountdown();
  }, 1000);
}
function stopCountdown() { if (countdownTimer) clearInterval(countdownTimer); }
function renderCountdown() {
  const ring = document.getElementById('timer-ring');
  const num = document.getElementById('timer-num');
  num.textContent = remainSec;
  ring.style.strokeDashoffset = RING_LEN * (1 - remainSec / POLL_SECONDS);
  let color = '#3b82f6';           // 10→6초 파랑
  if (remainSec <= 3) color = '#ef4444';       // 3→0초 빨강
  else if (remainSec <= 5) color = '#f59e0b';  // 5→4초 주황
  ring.style.stroke = color;
  num.style.color = color;
}
function markUpdated() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('updated-at').textContent = `마지막 갱신 ${hh}:${mm}:${ss}`;
}

// ─────────────────────────────────────────────
// 노선 검색
// ─────────────────────────────────────────────
const searchInput = document.getElementById('route-search');
const dropdown = document.getElementById('search-dropdown');

document.getElementById('search-btn').addEventListener('click', searchRoutes);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchRoutes(); });
document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) dropdown.classList.remove('open');
});

async function searchRoutes() {
  const keyword = searchInput.value.trim();
  if (!keyword) { toast('노선 번호를 입력하세요', 'error'); return; }
  try {
    const res = await fetch(`/api/search_routes?keyword=${encodeURIComponent(keyword)}`);
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message);
    if (!json.data.length) { toast('검색 결과가 없습니다', 'error'); return; }
    dropdown.innerHTML = json.data.map(r => `
      <div class="search-item" data-id="${r.routeId}" data-name="${r.routeName}">
        <div class="name">${r.routeName}
          <span class="type">${r.routeTypeName || ''}</span>
          ${r.modelSupported === false ? '<span class="unsupported">⚠ 모델 미지원(근사 예측)</span>' : ''}
        </div>
        <div class="path">${r.startStationName} → ${r.endStationName}</div>
      </div>`).join('');
    dropdown.classList.add('open');
    dropdown.querySelectorAll('.search-item').forEach(el =>
      el.addEventListener('click', () => selectRoute(el.dataset.id, el.dataset.name)));
  } catch (err) {
    toast('노선 검색 실패: ' + err.message, 'error');
  }
}

// ─────────────────────────────────────────────
// 노선 선택 → 정류장 + 버스 로드, 폴링 재시작
// ─────────────────────────────────────────────
async function selectRoute(routeId, routeName) {
  dropdown.classList.remove('open');
  currentRouteId = routeId;
  currentRouteName = routeName;
  document.getElementById('sidebar-title').textContent = `정류장 목록 — ${routeName}`;
  setLoading(true, `${routeName} 노선 로드 중...`);
  clearMap();
  try {
    const res = await fetch(`/api/stations/${routeId}`);
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message);
    stations = json.data;
    drawStations();
    renderSidebar();
    fitBounds();
    await refreshBuses();
    startPolling();
    toast(`${routeName} 노선 로드 완료 (정류장 ${stations.length}개)`, 'success');
  } catch (err) {
    toast('노선 로드 실패: ' + err.message, 'error');
  } finally {
    setLoading(false);
  }
}

function clearMap() {
  Object.values(stationMarkers).forEach(m => m.setMap(null));
  Object.values(busMarkers).forEach(m => m.setMap(null));
  stationMarkers = {}; busMarkers = {};
  activeSeq = null;
  document.getElementById('detail-panel').classList.remove('open');
}

function fitBounds() {
  if (!stations.length) return;
  const bounds = new kakao.maps.LatLngBounds();
  stations.forEach(s => bounds.extend(new kakao.maps.LatLng(s.lat, s.lng)));
  map.setBounds(bounds);
}

// ─────────────────────────────────────────────
// 정류장 마커 + 사이드바
// ─────────────────────────────────────────────
function stationMarkerImage(active) {
  const size = active ? 14 : 9;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size*2}" height="${size*2}">
    <circle cx="${size}" cy="${size}" r="${size-2}" fill="${active ? '#3b82f6' : '#ffffff'}"
      stroke="${active ? '#1d4ed8' : '#64748b'}" stroke-width="2"/></svg>`;
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
    new kakao.maps.Size(size*2, size*2), { offset: new kakao.maps.Point(size, size) });
}

function drawStations() {
  stations.forEach(s => {
    const marker = new kakao.maps.Marker({
      map, position: new kakao.maps.LatLng(s.lat, s.lng),
      image: stationMarkerImage(false), title: s.stationName, zIndex: 1
    });
    kakao.maps.event.addListener(marker, 'click', () => onStationClick(s));
    stationMarkers[s.stationSeq] = marker;
  });
}

function renderSidebar() {
  const list = document.getElementById('station-list');
  list.innerHTML = stations.map(s => `
    <div class="station-item" id="st-${s.stationSeq}" data-seq="${s.stationSeq}">
      <span class="seq">${s.stationSeq}</span>
      <span class="name">${s.stationName}</span>
      <span class="chip-slot"></span>
    </div>`).join('');
  list.querySelectorAll('.station-item').forEach(el =>
    el.addEventListener('click', () => {
      const s = stations.find(x => x.stationSeq === Number(el.dataset.seq));
      map.setLevel(4);
      map.panTo(new kakao.maps.LatLng(s.lat, s.lng));
      onStationClick(s);
    }));
}

// 사이드바 잔여석 칩: 현재 그 정류장에 있는 버스 표시
function updateSidebarChips() {
  document.querySelectorAll('.station-item .chip-slot').forEach(el => el.innerHTML = '');
  buses.forEach(b => {
    const slot = document.querySelector(`#st-${b.stationSeq} .chip-slot`);
    if (!slot) return;
    const c = congestion(b.remainSeatCnt);
    slot.innerHTML = `<span class="seat-chip ${c.chip}">${c.emoji} 여유 ${b.remainSeatCnt >= 0 ? b.remainSeatCnt + '석' : '?'}</span>`;
  });
}

function setActiveStation(seq) {
  if (activeSeq !== null && stationMarkers[activeSeq])
    stationMarkers[activeSeq].setImage(stationMarkerImage(false));
  document.querySelectorAll('.station-item.active').forEach(el => el.classList.remove('active'));
  activeSeq = seq;
  if (stationMarkers[seq]) {
    stationMarkers[seq].setImage(stationMarkerImage(true));
    stationMarkers[seq].setZIndex(5);
  }
  const el = document.getElementById('st-' + seq);
  if (el) {
    el.classList.add('active');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// ─────────────────────────────────────────────
// 버스 마커 (혼잡도 색상)
// ─────────────────────────────────────────────
function busMarkerImage(seats) {
  const c = congestion(seats);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="40">
    <rect x="4" y="2" width="26" height="26" rx="7" fill="${c.color}" stroke="#ffffff" stroke-width="2.5"/>
    <text x="17" y="20" text-anchor="middle" font-size="14">🚌</text>
    <polygon points="17,38 11,27 23,27" fill="${c.color}"/></svg>`;
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
    new kakao.maps.Size(34, 40), { offset: new kakao.maps.Point(17, 38) });
}

function busPosition(b) {
  const s = stations.find(x => x.stationSeq === b.stationSeq);
  return s ? new kakao.maps.LatLng(s.lat, s.lng) : null;
}

function drawBuses() {
  const alive = new Set();
  buses.forEach(b => {
    const pos = busPosition(b);
    if (!pos) return;
    alive.add(b.vehId);
    if (busMarkers[b.vehId]) {
      busMarkers[b.vehId].setPosition(pos);
      busMarkers[b.vehId].setImage(busMarkerImage(b.remainSeatCnt));
    } else {
      const marker = new kakao.maps.Marker({
        map, position: pos, image: busMarkerImage(b.remainSeatCnt),
        title: `${b.plateNo} (잔여 ${b.remainSeatCnt}석)`, zIndex: 10
      });
      busMarkers[b.vehId] = marker;
    }
  });
  Object.keys(busMarkers).forEach(id => {
    if (!alive.has(id)) { busMarkers[id].setMap(null); delete busMarkers[id]; }
  });
}

// ─────────────────────────────────────────────
// 폴링
// ─────────────────────────────────────────────
function startPolling() {
  stopPolling();
  startCountdown();
  pollTimer = setInterval(refreshBuses, POLL_SECONDS * 1000);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); stopCountdown(); }

async function refreshBuses() {
  if (!currentRouteId) return;
  try {
    const res = await fetch(`/api/buses/${currentRouteId}`);
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message);
    buses = json.data;
    drawBuses();
    updateSidebarChips();
    markUpdated();
    remainSec = POLL_SECONDS; // 타이머 리셋(동기화)
    renderCountdown();
  } catch (err) {
    toast('버스 위치 갱신 실패: ' + err.message, 'error');
  }
}

// ─────────────────────────────────────────────
// 정류장 클릭 → 예측
// ─────────────────────────────────────────────
async function onStationClick(s) {
  setActiveStation(s.stationSeq);
  showDetail(s, `<div class="pred-popup"><div class="title">탑승 가능성 계산 중</div><div style="color:#64748b;">🔮 실시간 버스 정보와 모델을 분석하고 있습니다.</div></div>`);

  const queueAhead = Math.max(0, parseInt(document.getElementById('queue-ahead').value || '0', 10));
  try {
    const res = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        route_id: currentRouteId,
        target_seq: s.stationSeq,
        queue_ahead: queueAhead,
        buses: buses
      })
    });
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message);
    renderPrediction(s, json.prediction, queueAhead);
  } catch (err) {
    showDetail(s, `<div class="pred-popup"><div style="color:#b91c1c;">예측 실패: ${err.message}</div></div>`);
    toast('예측 실패: ' + err.message, 'error');
  }
}

function renderPrediction(s, p, queueAhead) {
  if (!p) {
    showDetail(s, `<div class="pred-popup"><div style="color:#64748b;">이 정류장으로 접근 중인 버스가 없습니다.</div></div>`);
    return;
  }
  const cls = p.predicted_sent_class;
  const dispatchCards = (Array.isArray(p.sent_probabilities) ? p.sent_probabilities : []).map((v, i) => {
    const label = i === 3 ? '3+대' : `${i}대`;
    return `<div class="dispatch-prob-item ${i === cls ? 'active' : ''}"><strong>${label}</strong><small>${(v * 100).toFixed(0)}%</small></div>`;
  }).join('');
  const busRows = p.buses.map(b => {
    const c = congestion(b.predicted_seats);
    const probability = Math.round(b.board_by_probability * 100);
    const state = probability >= 70 ? ['good', '탑승 가능'] : probability >= 35 ? ['mid', '확인 필요'] : ['low', '탑승 어려움'];
    return `<article class="pred-bus-card">
      <div class="bus-card-head">
        <div class="bus-card-name"><span class="bus-order">${b.order}</span>${b.virtual ? '관측 외 가상 버스' : b.plate_no}</div>
        <span class="bus-card-state ${state[0]}">${state[1]}</span>
      </div>
      <div class="seat-line"><strong>${b.predicted_seats}석</strong><span>도착 예상 잔여석</span></div>
      <div class="prob-line"><span>${c.emoji} 누적 탑승 가능성</span><b>${probability}%</b></div>
      <div class="prob-track"><span style="width:${probability}%"></span></div>
    </article>`;
  }).join('');

  showDetail(s, `<div class="pred-popup">
    <div class="detail-kicker">LIVE BOARDING FORECAST</div>
    <div class="detail-queue">내 앞 대기 인원 <b>${queueAhead}명</b> 기준</div>
    <div class="pred-dispatch d${cls}">🚌 ${p.dispatch_message}<small>도착 순서의 버스 좌석 분포를 합산한 모델 권고입니다.</small></div>
    <div class="section-label">도착 예정 버스</div>
    ${busRows}
    <div class="dispatch-prob-card">
      <div class="dispatch-prob-head">배차 판단 확률 <span>선택된 값이 모델 권고</span></div>
      <div class="dispatch-prob-grid">${dispatchCards}</div>
      <div class="dispatch-expectation">기대 추가 배차: <b>${Number(p.expected_sent_buses).toFixed(1)}대</b>${p.route_fallback ? ' · ⚠ 근사 예측' : ''}</div>
    </div>
  </div>`);
}
</script>
</body>
</html>
